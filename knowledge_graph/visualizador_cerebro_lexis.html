nConexiones: 5\n\nSerán separados de la tutela: I.- Los que sin haber caucionado su manejo, conforme a la ley, ejerzan la administración de la tutela; II.- Los que se condujeren mal o con negligencia en el desempeño de la tutela, ya sea respecto de la persona, ya respecto de la administración de l...", "rol": "articulo", "ley_id": "ley:cc_tlax", "color": "#38BDF8", "border": "#0F172A", "size": 12}, {"id": "articulo:cpc_tlax:1294", "label": "CPC-TLAX 1294", "title": "[CPC-TLAX] Artículo 1294 (Capitulo VI)\nConexiones: 25\n\nCuando entre los interesados en la herencia hubiere menores, la enajenación de los bienes se sujetará a lo dispuesto en los artículos 1553 a 1577 de este Código....", "rol": "articulo", "ley_id": "ley:cpc_tlax", "color": "#818CF8", "border": "#0F172A", "size": 24}, {"id": "articulo:cc_tlax:2653", "label": "CC-TLAX 2653", "title": "[CC-TLAX] Artículo 2653 (Capitulo III)\nConexiones: 7\n\nPor razón de la comisión de un ilícito, son incapaces de adquirir por testamento o por intestado: I.- El que haya sido condenado por un delito intencional que merezca pena de prisión, cometido contra el autor de la herencia, de sus ascendientes, de sus descendientes, de sus herma...", "rol": "articulo", "ley_id": "ley:cc_tlax", "color": "#38BDF8", "border": "#0F172A", "size": 13}, {"id": "articulo:lft:899-E", "label": "LFT 899-E", "title": "[LFT] Artículo 899-E (Seccion)\nConexiones: 7\n\nEn el procedimiento se observará lo establecido en la sección primera de este capítulo, y en los casos en que se demanden prestaciones derivadas de riesgos de trabajo o enfermedades generales, el procedimiento se sujetará además a las siguientes reglas: Cuando lo planteado en la ...", "rol": "articulo", "ley_id": "ley:lft", "color": "#34D399", "border": "#0F172A", "size": 13}, {"id": "articulo:cc_tlax:2706", "label": "CC-TLAX 2706", "title": "[CC-TLAX] Artículo 2706 (Capitulo VI)\nConexiones: 22\n\nRespecto de la capacidad de los legatarios se observará lo dispuesto en los artículos 2651 a 2672....", "rol": "articulo", "ley_id": "ley:cc_tlax", "color": "#38BDF8", "border": "#0F172A", "size": 22}, {"id": "articulo:cpp_tlax:446", "label": "CPP-TLAX 446", "title": "[CPP-TLAX] Artículo 446 (Titulo)\nConexiones: 7\n\nConcluida la recepción de pruebas o cuando no se hubiere ofrecido ninguna, el juez declarará cerrada la instrucción y requerirá al ministerio público para que en el mismo acto formule las conclusiones que estime conducentes....", "rol": "articulo", "ley_id": "ley:cpp_tlax", "color": "#FB923C", "border": "#0F172A", "size": 13}, {"id": "articulo:cc_tlax:372", "label": "CC-TLAX 372", "title": "[CC-TLAX] Artículo 372 (Capitulo IX)\nConexiones: 5\n\nDurante los tres meses señalados en el artículo precedente, desempeñará la administración de los bienes un tutor interino, quien los recibirá por inventario solemne....", "rol": "articulo", "ley_id": "ley:cc_tlax", "color": "#38BDF8", "border": "#0F172A", "size": 12}, {"id": "articulo:lft:709-C", "label": "LFT 709-C", "title": "[LFT] Artículo 709-C (Capitulo)\nConexiones: 10\n\nNo se admitirá recusación: Fracción I. Al cumplimentar exhortos, ejecuciones y demás diligencias cuya práctica se encomiende por otros Tribunales; Fracción II. En los procedimientos a los que se refieren los artículos 982 al 991; Fracción III. En los demás en que no se asuma juri...", "rol": "articulo", "ley_id": "ley:lft", "color": "#34D399", "border": "#0F172A", "size": 15}, {"id": "articulo:cpeum:95", "label": "CPEUM 95", "title": "[CPEUM] Artículo 95 (Capitulo IV)\nConexiones: 7\n\nPara ser electo ministro de la Suprema Corte de Justicia de la Nación, se necesita: Fracción I. Ser ciudadano mexicano por nacimiento, en pleno ejercicio de sus derechos políticos y civiles. Fracción II. Se deroga Fracción reformada DOF 15-12-1934, 31-12-1994. Derogada DOF 15-09-...", "rol": "articulo", "ley_id": "ley:cpeum", "color": "#FBBF24", "border": "#0F172A", "size": 13}, {"id": "articulo:cpeum:1", "label": "CPEUM 1", "title": "[CPEUM] Artículo 1 (Capitulo I)\nConexiones: 10\n\nEn los Estados Unidos Mexicanos todas las personas gozarán de los derechos humanos reconocidos en esta Constitución y en los tratados internacionales de los que el Estado Mexicano sea parte, así como de las garantías para su protección, cuyo ejercicio no podrá restringirse ni sus...", "rol": "articulo", "ley_id": "ley:cpeum", "color": "#FBBF24", "border": "#0F172A", "size": 15}, {"id": "articulo:cpp_tlax:450", "label": "CPP-TLAX 450", "title": "[CPP-TLAX] Artículo 450 (Titulo)\nConexiones: 43\n\nContra las resoluciones dictadas en el procedimiento sumario no cabe recurso alguno; pero la sentencia será apelable y este recurso se tramitará como lo disponen los artículos 264 a 298. La interposición del recurso de apelación no suspende la ejecución de la sentencia apelada, c...", "rol": "articulo", "ley_id": "ley:cpp_tlax", "color": "#FB923C", "border": "#0F172A", "size": 24}, {"id": "articulo:cpc_tlax:1006", "label": "CPC-TLAX 1006", "title": "[CPC-TLAX] Artículo 1006 (Capitulo I)\nConexiones: 36\n\nDeberá iniciarse y seguirse el juicio de responsabilidad civil proveniente de delito, ante el Juez civil: I.- Cuando el Ministerio Público no haya ejercitado la acción penal; II.- Cuando habiendo ejercitado el Ministerio Público la acción penal, se haya desistido de ella; III.- C...", "rol": "articulo", "ley_id": "ley:cpc_tlax", "color": "#818CF8", "border": "#0F172A", "size": 24}, {"id": "articulo:cpeum:73", "label": "CPEUM 73", "title": "[CPEUM] Artículo 73 (Seccion III)\nConexiones: 16\n\nEl Congreso tiene facultad: Fracción I. Para admitir nuevos Estados a la Unión Federal; Fracción reformada DOF 08-10-1974 Fracción II. Derogada. Fracción derogada DOF 08-10-1974 Fracción III. Para formar nuevos Estados dentro de los límites de los existentes, siendo necesario al ...", "rol": "articulo", "ley_id": "ley:cpeum", "color": "#FBBF24", "border": "#0F172A", "size": 18}, {"id": "articulo:lft:153-Q", "label": "LFT 153-Q", "title": "[LFT] Artículo 153-Q (Capitulo)\nConexiones: 6\n\nA nivel de las entidades federativas se establecerán Comisiones Estatales de Concertación y Productividad. Será aplicable a las Comisiones Estatales de Concertación y Productividad, en el ámbito de las entidades federativas, lo establecido en los artículos 153-I, 153-J, 153-K, 15...", "rol": "articulo", "ley_id": "ley:lft", "color": "#34D399", "border": "#0F172A", "size": 12}, {"id": "articulo:cc_tlax:374", "label": "CC-TLAX 374", "title": "[CC-TLAX] Artículo 374 (Capitulo IX)\nConexiones: 7\n\nEstán exceptuados de la obligación de dar garantía: I.- Los tutores testamentarios, cuando expresamente los haya relevado de esta obligación el testador; II.- Los tutores, de cualquiera clase que sean, siempre que el incapaz no esté en posesión efectiva de sus bienes, y sólo teng...", "rol": "articulo", "ley_id": "ley:cc_tlax", "color": "#38BDF8", "border": "#0F172A", "size": 13}, {"id": "articulo:cpc_tlax:1469", "label": "CPC-TLAX 1469", "title": "[CPC-TLAX] Artículo 1469 (Capitulo XIV)\nConexiones: 6\n\nSatisfechos los requisitos a que se refieren los artículos anteriores y obtenido el consentimiento de las personas que deben darlo, conforme a los artículos 234 y 235 del Código civil, el Juez resolverá dentro de tercer día lo que corresponda. (REFORMADO, P.O. DE DE 2010)...", "rol": "articulo", "ley_id": "ley:cpc_tlax", "color": "#818CF8", "border": "#0F172A", "size": 12}, {"id": "articulo:cpp_tlax:8-BIS", "label": "CPP-TLAX 8 BIS", "title": "[CPP-TLAX] Artículo 8 BIS (Capitulo I)\nConexiones: 6\n\nLos delitos que requieren para su investigación querella son los siguientes: Fracción I. Delitos de bogados patronos y litigantes; Fracción II. Responsabilidad médica y técnica; Fracción III. Falsificación de documentos de crédito; Fracción IV. Incumplimiento de obligación alimen...", "rol": "articulo", "ley_id": "ley:cpp_tlax", "color": "#FB923C", "border": "#0F172A", "size": 12}, {"id": "articulo:cpp_tlax:461", "label": "CPP-TLAX 461", "title": "[CPP-TLAX] Artículo 461 (Capitulo I)\nConexiones: 6\n\nEn los casos de las artículos 2° y 3° del Código penal, será competente el tribunal en cuya jurisdicción territorial se produzcan o se haya pretendido que tengan efectos los delitos a que se refieren esas disposiciones. Pero si ese lugar se hallare fuera del Estado, se estará a l...", "rol": "articulo", "ley_id": "ley:cpp_tlax", "color": "#FB923C", "border": "#0F172A", "size": 12}, {"id": "articulo:cc_tlax:1074", "label": "CC-TLAX 1074", "title": "[CC-TLAX] Artículo 1074 (Seccion)\nConexiones: 7\n\nLa servidumbre establecida en el artículo anterior, trae consigo el derecho de tránsito para las personas y animales, y el de conducción de los materiales necesarios para el uso y reparación del acueducto, así como para el cuidado del agua que por él se conduce. Son aplicables, e...", "rol": "articulo", "ley_id": "ley:cc_tlax", "color": "#38BDF8", "border": "#0F172A", "size": 13}, {"id": "articulo:cpeum:123", "label": "CPEUM 123", "title": "[CPEUM] Artículo 123 (Titulo)\nConexiones: 46\n\nToda persona tiene derecho al trabajo digno y socialmente útil; al efecto, se promoverán la creación de empleos y la organización social de trabajo, conforme a la ley. Reformado DOF 18-06-2008. Publicado sin cambios DOF 01-04-2025 El Estado otorgará un apoyo económico mensual equ...", "rol": "articulo", "ley_id": "ley:cpeum", "color": "#FBBF24", "border": "#0F172A", "size": 24}, {"id": "articulo:cpeum:14", "label": "CPEUM 14", "title": "[CPEUM] Artículo 14 (Capitulo I)\nConexiones: 6\n\nA ninguna ley se dará efecto retroactivo en perjuicio de persona alguna. Nadie podrá ser privado de la libertad o de sus propiedades, posesiones o derechos, sino mediante juicio seguido ante los tribunales previamente establecidos, en el que se cumplan las formalidades esenciales...", "rol": "articulo", "ley_id": "ley:cpeum", "color": "#FBBF24", "border": "#0F172A", "size": 12}, {"id": "articulo:cc_tlax:2969", "label": "CC-TLAX 2969", "title": "[CC-TLAX] Artículo 2969 (Capitulo V)\nConexiones: 9\n\nDesempeñará el albaceazgo la persona que designe el testador. El testador podrá nombrar albaceas sucesivos, los que desempeñarán el cargo en el orden nombrado, si el testador no dispone otra cosa; pero los albaceas nunca serán mancomunados, ni solidarios ni aun por disposición de...", "rol": "articulo", "ley_id": "ley:cc_tlax", "color": "#38BDF8", "border": "#0F172A", "size": 14}, {"id": "articulo:cpeum:28", "label": "CPEUM 28", "title": "[CPEUM] Artículo 28 (Capitulo I)\nConexiones: 15\n\nEn los Estados Unidos Mexicanos quedan prohibidos los monopolios, las prácticas monopólicas, los estancos, las condonaciones de impuestos y las exenciones de impuestos en los términos y condiciones que fijan las leyes. El mismo tratamiento se dará a las prohibiciones a título de ...", "rol": "articulo", "ley_id": "ley:cpeum", "color": "#FBBF24", "border": "#0F172A", "size": 18}, {"id": "articulo:cc_tlax:1380", "label": "CC-TLAX 1380", "title": "[CC-TLAX] Artículo 1380 (Seccion)\nConexiones: 8\n\nEl incapaz que cause daño debe repararlo, salvo que la responsabilidad recaiga en las personas de él encargadas, conforme a lo dispuesto en los artículos 1383 a 1390....", "rol": "articulo", "ley_id": "ley:cc_tlax", "color": "#38BDF8", "border": "#0F172A", "size": 13}, {"id": "articulo:cpeum:116", "label": "CPEUM 116", "title": "[CPEUM] Artículo 116 (Titulo)\nConexiones: 11\n\nEl poder público de los estados se dividirá, para su ejercicio, en Ejecutivo, Legislativo y Judicial, y no podrán reunirse dos o más de estos poderes en una sola persona o corporación, ni depositarse el legislativo en un solo individuo. Los poderes de los Estados se organizarán c...", "rol": "articulo", "ley_id": "ley:cpeum", "color": "#FBBF24", "border": "#0F172A", "size": 15}, {"id": "articulo:cc_tlax:1383", "label": "CC-TLAX 1383", "title": "[CC-TLAX] Artículo 1383 (Seccion)\nConexiones: 6\n\nLos ascendientes tienen obligación de responder de los d ley:cpeum", "color": "#FBBF24", "border": "#0F172A", "size": 15}, {"id": "articulo:cpc_tlax:1208", "label": "CPC-TLAX 1208", "title": "[CPC-TLAX] Artículo 1208 (Capitulo III)\nConexiones: 9\n\nCuando en el caso previsto por los artículos 1198 a 1201, los herederos presentes hubieren nombrado albacea y en virtud de la convocatoria de que habla el artículo 1202, se presentaren nuevos herederos que acrediten sus derechos, el Juez citará a una nueva junta para los efectos ...", "rol": "articulo", "ley_id": "ley:cpc_tlax", "color": "#818CF8", "border": "#0F172A", "size": 14}, {"id": "articulo:lft:371", "label": "LFT 371", "title": "[LFT] Artículo 371 (Capitulo II)\nConexiones: 7\n\nLos estatutos de los sindicatos contendrán: Fracción I. Denominación que le distinga de los demás; Fracción II. Domicilio; Fracción III. Objeto; Fracción IV. Duración. Faltando esta disposición se entenderá constituido el sindicato por tiempo indeterminado; Fracción V. Condicione...", "rol": "articulo", "ley_id": "ley:lft", "color": "#34D399", "border": "#0F172A", "size": 13}, {"id": "articulo:cc_tlax:2972", "label": "CC-TLAX 2972", "title": "[CC-TLAX] Artículo 2972 (Capitulo V)\nConexiones: 11\n\nSi no hubiere mayoría, el albacea será nombrado por el juez, de entre los propuestos....", "rol": "articulo", "ley_id": "ley:cc_tlax", "color": "#38BDF8", "border": "#0F172A", "size": 15}, {"id": "articulo:cpc_tlax:1526", "label": "CPC-TLAX 1526", "title": "[CPC-TLAX] Artículo 1526 (Capitulo XX)\nConexiones: 18\n\nEl día último de enero de cada año, los jueces examinarán dichos registros y en vista de ellos dictarán de las medidas siguientes, las que correspondan según las circunstancias: I.- Si apareciere que ha fallecido algún tutor, harán que sea reemplazado con arreglo a la ley; II.- S...", "rol": "articulo", "ley_id": "ley:cpc_tlax", "color": "#818CF8", "border": "#0F172A", "size": 19}, {"id": "articulo:lft:992", "label": "LFT 992", "title": "[LFT] Artículo 992 (Titulo)\nConexiones: 6\n\nLas vio partícipes calculada por cantidades, no sujetándose a las reglas establecidas para bienes de...", "rol": "articulo", "ley_id": "ley:cc_tlax", "color": "#38BDF8", "border": "#0F172A", "size": 13}, {"id": "articulo:lft:429", "label": "LFT 429", "title": "[LFT] Artículo 429 (Capitulo VII)\nConexiones: 6\n\nEn los casos señalados en el artículo 427, se observarán las normas siguientes: Fracción I. Si se trata de la fracción I, el patrón o su representante, dará aviso de la suspensión al Tribunal, para que éste, previo el procedimiento consignado en el Procedimiento Especial Colectiv...", "rol": "articulo", "ley_id": "ley:lft", "color": "#34D399", "border": "#0F172A", "size": 12}, {"id": "articulo:lft:1004-C", "label": "LFT 1004-C", "title": "[LFT] Artículo 1004-C (Titulo)\nConexiones: 7\n\nA quien realice subcontratación de personal a que se refiere el artículo 12 de esta Ley, así como a las personas físicas o morales que presten servicios de subcontratación sin contar con el registro correspondiente, conforme a lo establecido en los artículos 14 y 15 de esta Ley, ...", "rol": "articulo", "ley_id": "ley:lft", "color": "#34D399", "border": "#0F172A", "size": 13}, {"id": "articulo:cc_tlax:412", "label": "CC-TLAX 412", "title": "[CC-TLAX] Artículo 412 (Capitulo X)\nConexiones: 10\n\nLa venta de bienes raíces del incapacitado es nula si no se hace judicialmente en subasta pública; pero el juez decidirá si conviene o no la almoneda, pudiendo dispensarla, acreditada la utilidad que resulte al incapacitado. En este caso la venta de inmuebles sólo podrá hacerse e...", "rol": "articulo", "ley_id": "ley:cc_tlax", "color": "#38BDF8", "border": "#0F172A", "size": 15}, {"id": "articulo:cpp_tlax:161", "label": "CPP-TLAX 161", "title": "[CPP-TLAX] Artículo 161 (Capitulo V)\nConexiones: 7\n\nLos testigos deben ser examinados separadamente y sólo las partes podrán asistir a la diligencia, salvo que el testigo sea ciego, sordo, mudo o ignore el idioma castellano, pues en estos casos se observará lo dispuesto en los artículos 492 a 498, en su caso y si el testigo es cie...", "rol": "articulo", "ley_id": "ley:cpp_tlax", "color": "#FB923C", "border": "#0F172A", "size": 13}, {"id": "articulo:cpc_tlax:1003", "label": "CPC-TLAX 1003", "title": "[CPC-TLAX] Artículo 1003 (Capitulo I)\nConexiones: 8\n\nEl término de prueba será de quince días y dentro de él se podrán alegar y probar las tachas que tuvieren los testigos, sin perjuicio de aplicar en su caso, los artículos 456 a 464 de este Código....", "rol": "articulo", "ley_id": "ley:cpc_tlax", "color": "#818CF8", "border": "#0F172A", "size": 13}, {"id": "articulo:lft:132", "label": "LFT 132", "title": "[LFT] Artículo 132 (Capitulo I)\nConexiones: 17\n\nSon obligaciones de las personas empleadoras: I.- Cumplir las disposiciones de las normas de trabajo aplicables a sus empresas o establecimientos; II.- Pagar a los trabajadores los salarios e indemnizaciones, de conformidad con las normas vigentes en la empresa o establecimiento;...", "rol": "articulo", "ley_id": "ley:lft", "color": "#34D399", "border": "#0F172A", "size": 19}, {"id": "articulo:cpp_tlax:451", "label": "CPP-TLAX 451", "title": "[CPP-TLAX] Artículo 451 (Titulo)\nConexiones: 7\n\nTodas las actuaciones en el procedimiento sumario se practicarán a continuación unas de otras; se harán constar por escrito, asentándose únicamente lo sustancial de las mismas, para lo cual se hará un extracto de ellas y el 24/04/2017 11:32 p. m. 66 procedimiento deberá terminars...", "rol": "articulo", "ley_id": "ley:cpp_tlax", "color": "#FB923C", "border": "#0F172A", "size": 13}, {"id": "articulo:cc_tlax:2864", "label": "CC-TLAX 2864", "title": "[CC-TLAX] Artículo 2864 (Capitulo IV)\nConexiones: 6\n\nSi los testigos fueren idóneos y estuvieren conformes en todas y cada una de las circunstancias enumeradas en el artículo que precede, el Juez declarará el contenido de los dichos de aquéllos, formal testamento de la persona de quien se trate; lo mandará protocolizar y dispondrá ...", "rol": "articulo", "ley_id": "ley:cc_tlax", "color": "#38BDF8", "border": "#0F172A", "size": 12}, {"id": "articulo:cc_tlax:875", "label": "CC-TLAX 875", "title": "[CC-TLAX] Artículo 875 (Capitulo)\nConexiones: 5\n\nCon objeto de favorecer la formación del patrimonio de la familia, se venderán a las personas que tengan capacidad legal para constituirlo y que quieran hacerlo, las propiedades raíces que a continuación se expresan: I.- Los terrenos pertenecientes al Gobierno del Estado o a los ...", "rol": "articulo", "ley_id": "ley:cc_tlax", "color": "#38BDF8", "border": "#0F172A", "size": 12}, {"id": "articulo:cp_tlax:434", "label": "CP-TLAX 434", "title": "[CP-TLAX] Artículo 434 (Capitulo)\nConexiones: 62\n\nDe los delitos señalados en el presente ordenamiento, se consideran como delitos graves o que ameritan prisión preventiva oficiosa los siguientes: Fracción I. Homicidio doloso y su tentativa previsto en los artículos 19, 79, 224 a 228, 230 y 231; 79 Código Penal para el Estado Li...", "rol": "articulo", "ley_id": "ley:cp_tlax", "color": "#F87171", "border": "#0F172A", "size": 24}, {"id": "articulo:cpc_tlax:1377", "label": "CPC-TLAX 1377", "title": "[CPC-TLAX] Artículo 1377 (Capitulo X)\nConexiones: 15\n\nPara la apertura del testamento cerrado, se observarán los artículos 2849 a 2853 del Código civil....", "rol": "articulo", "ley_id": "ley:cpc_tlax", "color": "#818CF8", "border": "#0F172A", "size": 18}, {"id": "articulo:lft:450", "label": "LFT 450", "title": "[LFT] Artículo 450 (Capitulo II)\nConexiones: 12\n\nLa huelga deberá tener por objeto: Fracción I. Conseguir el equilibrio entre los diversos factores de la producción, armonizando los derechos del trabajo con los del capital; Fracción II. Obtener del patrón o patrones la celebración del contrato colectivo de trabajo y exigir su r...", "rol": "articulo", "ley_id": "ley:lft", "color": "#34D399", "border": "#0F172A", "size": 16}, {"id": "articulo:cpc_tlax:24", "label": "CPC-TLAX 24", "title": "[CPC-TLAX] Artículo 24 (Capitulo I)\nConexiones: 6\n\nCuando la celebración de un contrato no se haya hecho constar con la formalidad establecida en la ley, cualquiera de las partes tiene acción para exigir de la otra que se extienda el documento correspondiente....", "rol": "articulo", "ley_id": "ley:cpc_tlax", "color": "#818CF8", "border": "#0F172A", "size": 12}, {"id": "articulo:cpc_tlax:1516", "label": "CPC-TLAX 1516", "title": "[CPC-TLAX] Artículo 1516 (Capitulo XVIII)\nConexiones: 6\n\nEn todo auto de discernimiento del cargo de tutor, deberá expresar el Juez el tanto por ciento que, con arreglo a lo prevenido en los artículos 429 y 430 del Código civil corresponda al nombrado; o la pensión o el legado que por el desempeño de su cargo le haya asignado el autor ...", "rol": "articulo", "ley_id": "ley:cpc_tlax", "color": "#818CF8", "border": "#0F172A", "size": 12}, {"id": "articulo:cc_tlax:2624", "label": "CC-TLAX 2624", "title": "[CC-TLAX] Artículo 2624 (Capitulo II)\nConexiones: 14\n\nRespecto a las condiciones puestas en los testamentos, regirán las disposiciones contenidas en los artículos 1428 a 1441, en todo lo que no esté especialmente determinado en este libro....", "rol": "articulo", "ley_id": "ley:cc_tlax", "color": "#38BDF8", "border": "#0F172A", "size": 17}, {"id": "articulo:lft:590-A", "label": "LFT 590-A", "title": "[LFT] Artículo 590-A (Capitulo)\nConexiones: 7\n\nCorresponde al Centro Federal de Conciliación y Registro Laboral las siguientes atribuciones: Fracción I. Realizar en materia federal la función conciliadora a que se refiere el párrafo cuarto de la fracción XX del artículo 123 constitucional; Fracción II. Llevar el registro de t...", "rol": "articulo", "ley_id": "ley:lft", "color": "#34D399", "border": "#0F172A", "size": 13}, {"id": "articulo:cc_tlax:130", "label": "CC-TLAX 130", "title": "[CC-TLAX] Artículo 130 (Seccion III)\nConexiones: 10\n\nAl admitirse la solicitud de divorcio o antes, si hubiere urgencia, se adoptarán provisionalmente, y sólo mientras duren los procedimientos judiciales las medidas de protección siguientes: (REFORMADA, P.O. 30 DE DICIEMBRE DE 2016) I.- Separar a los cónyuges en todo caso. Para est...", "rol": "articulo", "ley_id": "ley:cc_tlax", "color": "#38BDF8", "border": "#0F172A", "size": 15}, {"id": "articulo:cpeum:3", "label": "CPEUM 3", "title": "[CPEUM] Artículo 3 (Capitulo I)\nConexiones: 9\n\nToda persona tiene derecho a la educación. El Estado -Federación, Estados, Ciudad de México y Municipios- impartirá y garantizará la educación inicial, preescolar, primaria, secundaria, media superior y superior. La educación inicial, preescolar, primaria y secundaria, conforman ...", "rol": "articulo", "ley_id": "ley:cpeum", "color": "#FBBF24", "border": "#0F172A", "size": 14}, {"id": "articulo:cc_tlax:410", "label": "CC-TLAX 410", "title": "[CC-TLAX] Artículo 410 (Capitulo X)\nConexiones: 12\n\nCuando la enajenación se haya permitido para cubrir con su producto algún objeto determinado, el juez señalará al tutor un plazo dentro del cual deberá acreditar que el producto de la enajenación se ha invertido en su objeto. Mientras no se haga la inversión se observará lo dispu...", "rol": "articulo", "ley_id": "ley:cc_tlax", "color": "#38BDF8", "border": "#0F172A", "size": 16}, {"id": "articulo:cc_tlax:1388", "label": "CC-TLAX 1388", "title": "[CC-TLAX] Artículo 1388 (Seccion)\nConexiones: 6\n\nLos maestros artesanos son responsables de los daños y perjuicios causados por sus operarios en la ejecución de los trabajos que les encomienden. En este caso se aplica también lo dispuesto en el artículo anterior....", "rol": "articulo", "ley_id": "ley:cc_tlax", "color": "#38BDF8", "border": "#0F172A", "size": 12}, {"id": "articulo:lft:47", "label": "LFT 47", "title": "[LFT] Artículo 47 (Capitulo IV)\nConexiones: 6\n\nSon causas de rescisión de la relación de trabajo, sin responsabilidad para el patrón: Fracción I. Engañarlo el trabajador o en su caso, el sindicato que lo hubiese propuesto o recomendado con certificados falsos o referencias en los que se atribuyan al trabajador capacidad, apti...", "rol": "articulo", "ley_id": "ley:lft", "color": "#34D399", "border": "#0F172A", "size": 12}, {"id": "articulo:cpp_tlax:440", "label": "CPP-TLAX 440", "title": "[CPP-TLAX] Artículo 440 (Titulo)\nConexiones: 9\n\nEl Procedimiento Sumario tiene por objeto la investigación y sanción de: I.- Los delitos cuya pena máxima de prisión sea de cinco años, o sólo multa; y II.- Los delitos a que se refiere el artículo 452. El proceso dejará de tramitarse en procedimiento sumario, tan pronto manifies...", "rol": "articulo", "ley_id": "ley:cpp_tlax", "color": "#FB923C", "border": "#0F172A", "size": 14}, {"id": "articulo:lft:590-B", "label": "LFT 590-B", "title": "[LFT] Artículo 590-B (Capitulo)\nConexiones: 6\n\nEl Centro Federal de Conciliación y Registro Laboral se constituirá y funcionará de conformidad con los siguientes lineamientos: Será un Organismo Público Descentralizado del Gobierno Federal, con domicilio en la Ciudad de México y contará con oficinas regionales conforme a los l...", "rol": "articulo", "ley_id": "ley:lft", "color": "#34D399", "border": "#0F172A", "size": 12}, {"id": "articulo:cpeum:27", "label": "CPEUM 27", "title": "[CPEUM] Artículo 27 (Capitulo I)\nConexiones: 17\n\nLa propiedad de las tierras y aguas comprendidas dentro de los límites del territorio nacional, corresponde originariamente a la Nación, la cual ha tenido y tiene el derecho de transmitir el dominio de ellas a los particulares, constituyendo la propiedad privada. Las expropiacion...", "rol": "articulo", "ley_id": "ley:cpeum", "color": "#FBBF24", "border": "#0F172A", "size": 19}, {"id": "articulo:cc_tlax:2932", "label": "CC-TLAX 2932", "title": "[CC-TLAX] Artículo 2932 (Capitulo II)\nConexiones: 6\n\nLo dispuesto en los artículos 2926 a 2931 se observará igualmente en los legados....", "rol": "articulo", "ley_id": "ley:cc_tlax", "color": "#38BDF8", "border": "#0F172A", "size": 12}, {"id": "articulo:cpeum:19", "label": "CPEUM 19", "title": "[CPEUM] Artículo 19 (Capitulo I)\nConexiones: 10\n\nNinguna detención ante autoridad judicial podrá exceder del plazo de setenta y dos horas, a partir de que el indiciado sea puesto a su disposición, sin que se justifique con un auto de vinculación a proceso en el que se expresará: el delito que se impute al acusado; el lugar, tie...", "rol": "articulo", "ley_id": "ley:cpeum", "color": "#FBBF24", "border": "#0F172A", "size": 15}, {"id": "articulo:cc_tlax:881", "label": "CC-TLAX 881", "title": "[CC-TLAX] Artículo 881 (Capitulo)\nConexiones: 5\n\nEl patrimonio de la familia se extingue, en cualquiera de los casos siguientes: I.- Cuando todos los beneficiarios cesen de tener derecho de percibir alimentos; II.- Cuando sin causa justificada la familia deje de habitar por un año la casa que debe servirle de morada, o de culti...", "rol": "articulo", "ley_id": "ley:cc_tlax", "color": "#38BDF8", "border": "#0F172A", "size": 12}, {"id": "articulo:cpeum:115", "label": "CPEUM 115", "title": "[CPEUM] Artículo 115 (Titulo)\nConexiones: 6\n\nLos estados adoptarán, para su régimen interior, la forma de gobierno republicano, representativo, democrático, laico y popular, teniendo como base de su división territorial y de su organización política y administrativa, el municipio libre, conforme a las bases siguientes: Frac...", "rol": "articulo", "ley_id": "ley:cpeum", "color": "#FBBF24", "border": "#0F172A", "size": 12}, {"id": "articulo:cc_tlax:1386", "label": "CC-TLAX 1386", "title": "[CC-TLAX] Artículo 1386 (Seccion)\nConexiones: 5\n\nLos directores de sanatorios, hospitales o casas de salud son responsables civilmente de los daños y perjuicios causados por los incapaces, durante el tiempo que se encuentren en esos establecimientos, o durante el tiempo que hayan sido confiados a ellos para su curación. En este...", "rol": "articulo", "ley_id": "ley:cc_tlax", "color": "#38BDF8", "border": "#0F172A", "size": 12}, {"id": "articulo:cpp_tlax:41", "label": "CPP-TLAX 41", "title": "[CPP-TLAX] Artículo 41 (Capitulo I)\nConexiones: 12\n\nSi la pena máxima es de tres años o menos o cuando la pena sea alternativa, la instrucción deberá practicarse en los términos de los artículos 440 a 451....", "rol": "articulo", "ley_id": "ley:cpp_tlax", "color": "#FB923C", "border": "#0F172A", "size": 16}, {"id": "articulo:cpc_tlax:1379", "label": "CPC-TLAX 1379", "title": "[CPC-TLAX] Artículo 1379 (Capitulo X)\nConexiones: 15\n\nCumplido lo prescrito en los artículos 2849 a 2853 del Código civil, el Juez, en presencia de los testigos, del Ministerio Público y del Secretario, abrirá el testamento y lo leerá para sí, dándole después lectura en alta voz y omitiendo lo que deba permanecer en secreto....", "rol": "articulo", "ley_id": "ley:cpc_tlax", "color": "#818CF8", "border": "#0F172A", "size": 18}, {"id": "articulo:cc_tlax:1155", "label": "CC-TLAX 1155", "title": "[CC-TLAX] Artículo 1155 (Titulo)\nConexiones: 5\n\nLos poseedores civiles tienen derecho a: I.- Adquirir por usucapión el bien o derecho poseídos; II.- Gozar de las presunciones establecidas por la ley, mientras no se pruebe lo contrario; III.- Adquirir los frutos y demás percepciones que menciona el artículo 1156; IV.- Intentar ...", "rol": "articulo", "ley_id": "ley:cc_tlax", "color": "#38BDF8", "border": "#0F172A", "size": 12}, {"id": "articulo:lft:994", "label": "LFT 994", "title": "[LFT] Artículo 994 (Titulo)\nConexiones: 9\n\nSe impondrá multa, por el equivalente a: Fracción I. De 50 a 250 Unidades de Medida y Actualización, al patrón que no cumpla las disposiciones contenidas en los artículos 61, 69, 76 y 77; Fracción reformada DOF 01-05-2019 Fracción II. De 250 a 5000 Unidades de Medida y Actualizac...", "rol": "articulo", "ley_id": "ley:lft", "color": "#34D399", "border": "#0F172A", "size": 14}];

cpc_tlax:1570", "to": "articulo:cc_tlax:410", "label": "explicita_otra_ley", "title": "articulo:cpc_tlax:1570 -> articulo:cc_tlax:410\nClase: explicita_otra_ley\nRef: \"artículos 407 y 410 del Código civil\"", "color": "#FBBF24", "dashes": false, "width": 2.0}, {"from": "articulo:cpc_tlax:1575", "to": "articulo:cc_tlax:413", "label": "explicita_otra_ley", "title": "articulo:cpc_tlax:1575 -> articulo:cc_tlax:413\nClase: explicita_otra_ley\nRef: \"artículo 413 del Código civil\"", "color": "#FBBF24", "dashes": false, "width": 2.0}, {"from": "articulo:cpc_tlax:1576", "to": "articulo:cc_tlax:407", "label": "explicita_otra_ley", "title": "articulo:cpc_tlax:1576 -> articulo:cc_tlax:407\nClase: explicita_otra_ley\nRef: \"artículos 407 y 410 del Código civil\"", "color": "#FBBF24", "dashes": false, "width": 2.0}, {"from": "articulo:cpc_tlax:1576", "to": "articulo:cc_tlax:410", "label": "explicita_otra_ley", "title": "articulo:cpc_tlax:1576 -> articulo:cc_tlax:410\nClase: explicita_otra_ley\nRef: \"artículos 407 y 410 del Código civil\"", "color": "#FBBF24", "dashes": false, "width": 2.0}, {"from": "articulo:cpc_tlax:1577", "to": "articulo:cpc_tlax:1575", "label": "rango", "title": "articulo:cpc_tlax:1577 -> articulo:cpc_tlax:1575\nClase: rango\nRef: \"artículos 1554 a 1560 y 1575 a 1576\"", "color": "#475569", "dashes": false, "width": 1.1}, {"from": "articulo:cpc_tlax:1577", "to": "articulo:cpc_tlax:1576", "label": "rango", "title": "articulo:cpc_tlax:1577 -> articulo:cpc_tlax:1576\nClase: rango\nRef: \"artículos 1554 a 1560 y 1575 a 1576\"", "color": "#475569", "dashes": false, "width": 1.1}, {"from": "articulo:cpp_tlax:41", "to": "articulo:cpp_tlax:440", "label": "rango", "title": "articulo:cpp_tlax:41 -> articulo:cpp_tlax:440\nClase: rango\nRef: \"artículos 440 a 451\"", "color": "#475569", "dashes": false, "width": 1.1}, {"from": "articulo:cpp_tlax:41", "to": "articulo:cpp_tlax:441", "label": "rango", "title": "articulo:cpp_tlax:41 -> articulo:cpp_tlax:441\nClase: rango\nRef: \"artículos 440 a 451\"", "color": "#475569", "dashes": false, "width": 1.1}, {"from": "articulo:cpp_tlax:41", "to": "articulo:cpp_tlax:442", "label": "rango", "title": "articulo:cpp_tlax:41 -> articulo:cpp_tlax:442\nClase: rango\nRef: \"artículos 440 a 451\"", "color": "#475569", "dashes": false, "width": 1.1}, {"from": "articulo:cpp_tlax:41", "to": "articulo:cpp_tlax:443", "label": "rango", "title": "articulo:cpp_tlax:41 -> articulo:cpp_tlax:443\nClase: rango\nRef: \"artículos 440 a 451\"", "color": "#475569", "dashes": false, "width": 1.1}, {"from": "articulo:cpp_tlax:41", "to": "articulo:cpp_tlax:444", "label": "rango", "title": "articulo:cpp_tlax:41 -> articulo:cpp_tlax:444\nClase: rango\nRef: \"artículos 440 a 451\"", "color": "#475569", "dashes": false, "width": 1.1}, {"from": "articulo:cpp_tlax:41", "to": "articulo:cpp_tlax:445", "label": "rango", "title": "articulo:cpp_tlax:41 -> articulo:cpp_tlax:445\nClase: rango\nRef: \"artículos 440 a 451\"", "color": "#475569", "dashes": false, "width": 1.1}, {"from": "articulo:cpp_tlax:41", "to": "articulo:cpp_tlax:446", "label": "rango", "title": "articulo:cpp_tlax:41 -> articulo:cpp_tlax:446\nClase: rango\nRef: \"artículos 440 a 451\"", "color": "#475569", "dashes": false, "width": 1.1}, {"from": "articulo:cpp_tlax:41", "to": "articulo:cpp_tlax:447", "label": "rango", "title": "articulo:cpp_tlax:41 -> articulo:cpp_tlax:447\nClase: rango\nRef: \"artículos 440 a 451\"", "color": "#475569", "dashes": false, "width": 1.1}, {"from": "articulo:cpp_tlax:41", "to": "articulo:cpp_tlax:448", "label": "rango", "title": "articulo:cpp_tlax:41 -> articulo:cpp_tlax:448\nClase: rango\nRef: \"artículos 440 a 451\"", "color": "#475569", "dashes": false, "width": 1.1}, {"from": "articulo:cpp_tlax:41", "to": "articulo:cpp_tlax:449", "label": "rango", "title": "articulo:cpp_tlax:41 -> articulo:cpp_tlax:449\nClase: rango\nRef: \"artículos 440 a 451\"", "color": "#475569", "dashes": false, "width": 1.1}, {"from": "articulo:cpp_tlax:41", "to": "articulo:cpp_tlax:450", "label": "rango", "title": "articulo:cpp_tlax:41 -> articulo:cpp_tlax:450\nClase: rango\nRef: \"artículos 440 a 451\"", "color": "#475569", "dashes": false, "width": 1.1}, {"from": "articulo:cpp_tlax:41", "to": "articulo:cpp_tlax:451", "label": "rango", "title": "articulo:cpp_tlax:41 -> articulo:cpp_tlax:451\nClase: rango\nRef: \"artículos 440 a 451\"", "color": "#475569", "dashes": false, "width": 1.1}, {"from": "articulo:cpp_tlax:445", "to": "articulo:cpp_tlax:444", "label": "relativa", "title": "articulo:cpp_tlax:445 -> articulo:cpp_tlax:444\nClase: relativa\nRef: \"el artículo anterior\"", "color": "#475569", "dashes": false, "width": 1.1}, {"from": "articulo:cpp_tlax:450", "to": "articulo:cpp_tlax:440", "label": "directa", "title": "articulo:cpp_tlax:450 -> articulo:cpp_tlax:440\nClase: directa\nRef: \"la Fracción I del artículo 440\"", "color": "#475569", "dashes": false, "width": 1.1}];

const canvas = document.getElementById('lienzo');
const ctx = canvas.getContext('2d');
const panel = document.getElementById('panel-detalle');

let width = canvas.parentElement.clientWidth || 800;
let height = canvas.parentElement.clientHeight || 760;
canvas.width = width;
canvas.height = height;

let camX = 0, camY = 0, camScale = 1.0;
let nodoSeleccionado = null;
let nodoHover = null;
let nodoArrastrado = null;
let arrastrandoFondo = false;
let lastMouseX = 0, lastMouseY = 0;
let filtroTexto = "";

const nodeMap = new Map();
const nodes = rawNodes.map((n, i) => {
  const angle = (i / Math.max(1, rawNodes.length)) * Math.PI * 2;
  const radius = Math.min(width, height) * 0.28 * (0.4 + Math.random() * 0.6);
  const obj = {
    ...n,
    x: width / 2 + Math.cos(angle) * radius,
    y: height / 2 + Math.sin(angle) * radius,
    vx: 0,
    vy: 0,
    r: Math.max(7, Math.min(22, n.size || 13))
  };
  nodeMap.set(n.id, obj);
  return obj;
});

const edges = rawEdges.map(e => ({
  ...e,
  source: nodeMap.get(e.from),
  target: nodeMap.get(e.to)
})).filter(e => e.source && e.target);

function simularFisica() {
  const repulsion = 2400;
  const kSpring = 0.035;
  const longIdeal = 115;
  const gravedadCentro = 0.008;

  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i];
    for (let j = i + 1; j < nodes.length; j++) {
      const b = nodes[j];
      let dx = a.x - b.x;
      let dy = a.y - b.y;
      let dist2 = dx * dx + dy * dy + 1;
      if (dist2 < 90000) {
        let dist = Math.sqrt(dist2);
        let f = repulsion / dist2;
        let fx = (dx / dist) * f;
        let fy = (dy / dist) * f;
        a.vx += fx; a.vy += fy;
        b.vx -= fx; b.vy -= fy;
      }
    }
  }

  for (const e of edges) {
    const a = e.source;
    const b = e.target;
    let dx = b.x - a.x;
    let dy = b.y - a.y;
    let dist = Math.sqrt(dx * dx + dy * dy) || 1;
    let f = (dist - longIdeal) * kSpring;
    let fx = (dx / dist) * f;
    let fy = (dy / dist) * f;
    a.vx += fx; a.vy += fy;
    b.vx -= fx; b.vy -= fy;
  }

  for (const n of nodes) {
    if (n === nodoArrastrado) continue;
    n.vx += (width / 2 - n.x) * gravedadCentro;
    n.vy += (height / 2 - n.y) * gravedadCentro;
    n.vx *= 0.82;
    n.vy *= 0.82;
    n.x += Math.max(-12, Math.min(12, n.vx));
    n.y += Math.max(-12, Math.min(12, n.vy));
  }
}

function pantallaAMundo(px, py) {
  return {
    x: (px - width / 2 - camX) / camScale + width / 2,
    y: (py - height / 2 - camY) / camScale + height / 2
  };
}

function dibujar() {
  ctx.clearRect(0, 0, width, height);
  ctx.save();
  ctx.translate(width / 2 + camX, height / 2 + camY);
  ctx.scale(camScale, camScale);
  ctx.translate(-width / 2, -height / 2);

  // Dibujar aristas
  for (const e of edges) {
    const a = e.source;
    const b = e.target;
    const esConectadaSel = nodoSeleccionado && (a === nodoSeleccionado || b === nodoSeleccionado);
    ctx.beginPath();
    if (e.dashes) ctx.setLineDash([5, 4]);
    else ctx.setLineDash([]);
    ctx.strokeStyle = esConectadaSel ? '#22D3EE' : (e.color || '#475569');
    ctx.lineWidth = esConectadaSel ? (e.width + 1.2) : (e.width || 1.3);
    ctx.globalAlpha = (filtroTexto && !coincideFiltro(a) && !coincideFiltro(b)) ? 0.15 : 0.85;
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();

    // Punta de flecha
    const ang = Math.atan2(b.y - a.y, b.x - a.x);
    const tx = b.x - Math.cos(ang) * (b.r + 3);
    const ty = b.y - Math.sin(ang) * (b.r + 3);
    ctx.beginPath();
    ctx.setLineDash([]);
    ctx.fillStyle = ctx.strokeStyle;
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx - 7 * Math.cos(ang - Math.PI / 6), ty - 7 * Math.sin(ang - Math.PI / 6));
    ctx.lineTo(tx - 7 * Math.cos(ang + Math.PI / 6), ty - 7 * Math.sin(ang + Math.PI / 6));
    ctx.closePath();
    ctx.fill();

    // Etiqueta de arista cuando hay pocos nodos o está seleccionada
    if ((nodes.length <= 25 || esConectadaSel) && e.label) {
      const mx = (a.x + b.x) / 2;
      const my = (a.y + b.y) / 2;
      ctx.font = '9px Inter, sans-serif';
      ctx.fillStyle = '#94A3B8';
      ctx.textAlign = 'center';
      ctx.fillText(e.label, mx, my - 4);
    }
  }

  // Dibujar nodos
  ctx.setLineDash([]);
  for (const n of nodes) {
    const activo = !filtroTexto || coincideFiltro(n);
    ctx.globalAlpha = activo ? 1.0 : 0.18;

    ctx.save();
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    ctx.fillStyle = n.color || '#38BDF8';
    ctx.shadowColor = n.color || '#38BDF8';
    ctx.shadowBlur = (n === nodoSeleccionado || n === nodoHover || n.rol === 'semilla') ? 16 : 7;
    ctx.fill();
    ctx.lineWidth = (n === nodoSeleccionado || n.rol === 'semilla') ? 2.5 : 1.2;
    ctx.strokeStyle = (n === nodoSeleccionado) ? '#FFFFFF' : (n.border || '#0F172A');
    ctx.stroke();
    ctx.restore();

    // Etiqueta del nodo
    if (camScale > 0.55 || nodes.length <= 45 || n === nodoSeleccionado || n === nodoHover || n.rol === 'semilla') {
      ctx.font = (n.rol === 'semilla' || n.rol === 'ley') ? 'bold 11px Inter, sans-serif' : '10px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#090D16';
      ctx.strokeText(n.label, n.x, n.y + n.r + 12);
      ctx.fillStyle = '#F8FAFC';
      ctx.fillText(n.label, n.x, n.y + n.r + 12);
    }
  }

  ctx.restore();
}

function coincideFiltro(n) {
  if (!filtroTexto) return true;
  return n.id.toLowerCase().includes(filtroTexto) ||
         n.label.toLowerCase().includes(filtroTexto) ||
         (n.title && n.title.toLowerCase().includes(filtroTexto));
}

function buscarNodoEnPunto(mx, my) {
  const m = pantallaAMundo(mx, my);
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    const dx = m.x - n.x;
    const dy = m.y - n.y;
    if (dx * dx + dy * dy <= (n.r + 4) * (n.r + 4)) return n;
  }
  return null;
}

canvas.addEventListener('mousedown', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  lastMouseX = mx; lastMouseY = my;
  const tocado = buscarNodoEnPunto(mx, my);
  if (tocado) {
    nodoArrastrado = tocado;
    nodoSeleccionado = tocado;
    panel.style.display = 'block';
    panel.innerHTML = '<strong>Nodo seleccionado: ' + tocado.id + '</strong><br/>' +
                      (tocado.title || '').replace(/\n/g, '<br/>');
  } else {
    arrastrandoFondo = true;
    nodoSeleccionado = null;
    panel.style.display = 'none';
  }
});

window.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  if (nodoArrastrado) {
    const m = pantallaAMundo(mx, my);
    nodoArrastrado.x = m.x;
    nodoArrastrado.y = m.y;
    nodoArrastrado.vx = 0;
    nodoArrastrado.vy = 0;
  } else if (arrastrandoFondo) {
    camX += (mx - lastMouseX);
    camY += (my - lastMouseY);
  } else {
    nodoHover = buscarNodoEnPunto(mx, my);
  }
  lastMouseX = mx; lastMouseY = my;
});

window.addEventListener('mouseup', () => {
  nodoArrastrado = null;
  arrastrandoFondo = false;
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 0.89;
  camScale = Math.max(0.25, Math.min(3.5, camScale * factor));
}, { passive: false });

function centrarVista() {
  camX = 0; camY = 0; camScale = 1.0;
}

function filtrarNodos() {
  filtroTexto = document.getElementById('input-buscar').value.toLowerCase().trim();
  if (filtroTexto) {
    const primero = nodes.find(coincideFiltro);
    if (primero) {
      nodoSeleccionado = primero;
      camScale = 1.25;
      camX = (width / 2 - primero.x) * camScale;
      camY = (height / 2 - primero.y) * camScale;
      panel.style.display = 'block';
      panel.innerHTML = '<strong>Nodo encontrado: ' + primero.id + '</strong><br/>' +
                        (primero.title || '').replace(/\n/g, '<br/>');
    }
  }
}

// Pre-estabilización rápida inicial
for (let i = 0; i < 65; i++) simularFisica();

function animar() {
  simularFisica();
  dibujar();
  requestAnimationFrame(animar);
}
animar();
</script>
